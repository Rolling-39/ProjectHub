[package]
name = "project-manager"
version = "0.2.0"
description = "ProjectHub - 个人项目管理工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 环境适配，别删（schemars 的 E0107，见 ui-kit/docs/USAGE.md 第 5 节）
indexmap = { version = "1.9", default-features = false, features = ["std", "serde-1"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-ui-kit = { path = "../../ui-kit/rust" }
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy"] }
